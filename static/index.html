<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlantCare — мои растения</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="topbar"><a class="brand" href="/">🌿 PlantCare</a><div class="user-area"><span id="username"></span><button id="logoutBtn" class="ghost">Выйти</button></div></header><main class="container"><section class="welcome"><div><p class="eyebrow">ВАШ ЗЕЛЁНЫЙ УГОЛОК</p><h1>Мои растения</h1><p class="muted">Следите за поливом и заботьтесь о каждом листочке.</p></div><button id="addToggle" class="primary">＋ Добавить растение</button></section><section class="stats"><article class="stat"><span>Всего растений</span><strong id="plantsCount">—</strong></article><article class="stat"><span>Записей о поливе</span><strong id="wateringsCount">—</strong></article><article class="stat attention"><span>Пора полить</span><strong id="needWaterCount">—</strong></article></section><section id="plantFormWrap" class="panel hidden"><h2 id="formTitle">Новое растение</h2><form id="plantForm" class="plant-form"><input type="hidden" name="plant_id"><label>Название *<input name="name" required maxlength="100" placeholder="Например, Монстера"></label><label>Вид растения<input name="species" placeholder="Монстера делициоза"></label><label>Место<input name="room" placeholder="Гостиная"></label><label>Интервал полива (дней) *<input name="watering_interval" type="number" min="1" max="90" value="7" required></label><label>Последний полив<input name="last_watered" type="date"></label><label class="wide">Заметки<textarea name="notes" rows="2" placeholder="Особенности ухода..."></textarea></label><div class="form-actions"><button class="primary" type="submit">Сохранить</button><button id="cancelForm" class="ghost" type="button">Отмена</button></div></form></section><section class="toolbar"><input id="searchInput" placeholder="Поиск по названию растения..."><select id="filterSelect"><option value="">Все растения</option><option value="true">Пора полить</option><option value="false">Политы недавно</option></select></section><div id="status" class="status">Загрузка растений...</div><section id="plantsGrid" class="plants-grid"></section></main><dialog id="historyDialog" class="dialog"><div class="dialog-head"><h2 id="historyTitle">История поливов</h2><button id="closeDialog" class="ghost">✕</button></div><form id="wateringForm" class="watering-form"><label>Количество воды (мл)<input name="amount_ml" type="number" min="1" max="10000" value="200" required></label><label class="check"><input name="fertilizer_used" type="checkbox"> Использовано удобрение</label><label>Примечание<input name="note" maxlength="300"></label><button class="primary" type="submit">＋ Записать полив</button></form><div id="wateringList"></div></dialog><script src="/static/js/api.js"></script><script src="/static/js/plants.js"></script></body></html>
